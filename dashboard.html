<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <title>Ironnrootfitness | Admin Dashboard</title>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js"></script>
 <style>
  /* =========================
   GLOBAL RESET & THEME
========================= */
:root {
  --primary: #2563eb;
  --primary-dark: #1e40af;
  --bg: #f4f6fb;
  --card: #ffffff;
  --muted: #64748b;
  --text: #0f172a;
  --border: #e5e7eb;
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont;
  display: flex;
  height: 100vh;
  background: linear-gradient(135deg, #f8fafc, #eef2ff);
  color: var(--text);
}

/* =========================
   SIDEBAR
========================= */
.sidebar {
  width: 240px;
  background: linear-gradient(180deg, #020617, #0f172a);
  color: white;
  display: flex;
  flex-direction: column;
  padding: 28px 18px;
  border-right: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
}

.sidebar h2 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 36px;
  text-align: center;
  letter-spacing: 0.6px;
}

.nav-btn {
  padding: 14px 18px;
  margin-bottom: 10px;
  background: transparent;
  border: none;
  color: #cbd5f5;
  text-align: left;
  border-radius: 12px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.3s ease;
}

.nav-btn:hover {
  background: rgba(255,255,255,0.12);
  transform: translateX(6px);
}

.nav-btn.active {
  background: linear-gradient(135deg, var(--primary), #60a5fa);
  color: #fff;
  box-shadow: 0 10px 30px rgba(37,99,235,0.45);
}

.logout-btn {
  margin-top: auto;
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: white;
  font-weight: 600;
  padding: 14px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.logout-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(239,68,68,0.45);
}

/* =========================
   MAIN AREA
========================= */
.main {
  flex: 1;
  padding: 36px;
  overflow-y: auto;
}

h3 {
  margin: 26px 0;
  font-size: 24px;
  font-weight: 700;
  color: #020617;
}

/* =========================
   STATS CARDS
========================= */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 22px;
  margin-bottom: 36px;
}

.stat-card {
  border-radius: 20px;
  padding: 26px;
  color: white;
  text-align: center;
  font-size: 15px;
  font-weight: 500;
  position: relative;
  overflow: hidden;
  transition: all 0.35s ease;
}

.stat-card span {
  display: block;
  font-size: 36px;
  font-weight: 800;
  margin-top: 12px;
}

.stat-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top right, rgba(255,255,255,0.25), transparent 60%);
}

#nutritionCount { background: linear-gradient(135deg, #22c55e, #16a34a); }
#workoutCount { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
#coachingCount { background: linear-gradient(135deg, #f97316, #ea580c); }
#contactsCount { background: linear-gradient(135deg, #ec4899, #be185d); }

.stat-card:hover {
  transform: translateY(-8px) scale(1.04);
  box-shadow: 0 18px 40px rgba(0,0,0,0.25);
}

/* =========================
   SEARCH BAR
========================= */
.search-bar {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}

#searchInput {
  width: 100%;
  max-width: 440px;
  padding: 14px 20px;
  border-radius: 999px;
  border: 1px solid var(--border);
  font-size: 15px;
  background: white;
  transition: all 0.3s ease;
}

#searchInput:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 6px rgba(37,99,235,0.15);
  outline: none;
}

/* =========================
   TABLE
========================= */
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 14px 40px rgba(15,23,42,0.08);
}

th {
  padding: 18px;
  background: #f8fafc;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #475569;
}

td {
  padding: 18px;
  font-size: 14px;
  border-bottom: 1px solid var(--border);
}

tr:hover {
  background: #f1f5ff;
  transition: background 0.2s ease;
}

/* =========================
   MODAL (GLASS EFFECT)
========================= */
.modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(2,6,23,0.55);
  backdrop-filter: blur(8px);
  z-index: 100;
}

.modal-content {
  background: rgba(255,255,255,0.95);
  padding: 30px;
  border-radius: 20px;
  width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 25px 60px rgba(0,0,0,0.35);
  animation: fadeUp 0.35s ease;
}

@keyframes fadeUp {
  from { transform: translateY(30px) scale(0.96); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

.close-btn {
  margin-top: 22px;
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--primary), #60a5fa);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.close-btn:hover {
  box-shadow: 0 12px 28px rgba(37,99,235,0.45);
}

/* =========================
   ACTION BUTTONS
========================= */
.approve-btn {
  background: #22c55e;
  color: white;
  border-radius: 8px;
}

.deny-btn {
  background: #ef4444;
  color: white;
  border-radius: 8px;
}

 </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Dashboard</h2>
    <!-- <button class="nav-btn active" data-col="contacts" data-type="contact">📩 Messages</button> -->
    <button class="nav-btn" data-col="personal_nutrition_plan" data-type="normal">🥗 Personal Nutrition Plan</button>
    <button class="nav-btn" data-col="personal_workout_plan" data-type="normal">🏋️ Personal Workout Plan</button>
    <button class="nav-btn" data-col="ultimate_personal_coaching" data-type="normal">🔥 Ultimate Personal Coaching</button>
    <button class="nav-btn" data-col="users" data-type="visited">👀 Visited Customer</button>
    <button class="nav-btn" data-col="permissions" data-type="permissions">🛠️ Permissions</button>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card" id="nutritionCount">🥗 Nutrition Plan: <span>0</span></div>
      <div class="stat-card" id="workoutCount">🏋️ Personal Workouts: <span>0</span></div>
      <div class="stat-card" id="coachingCount">🔥 Ultimate Coaching: <span>0</span></div>
      <!-- <div class="stat-card" id="contactsCount">📩 Messages: <span>0</span></div> -->
       
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by Email, Phone, or Payment ID...">
    </div>

    <h3 id="collectionTitle">🥗 Personal Nutrition Plan</h3>
    <table>
      <thead id="tableHead"></thead>
      <tbody id="dataTable">
        <tr><td>Loading...</td></tr>
      </tbody>
    </table>
    <div id="pagination" class="pagination"></div>

   <style>
    /* =======================
   PROFESSIONAL PAGINATION
======================= */

.pagination {
  margin-top: 20px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.pagination button {
  min-width: 36px;
  height: 36px;
  padding: 0 12px;
  border-radius: 6px;
  border: 1px solid #ddd;
  background: #fff;
  color: #333;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.pagination button:hover:not(.active):not(.disabled) {
  background: #f5f5f5;
}

.pagination button.active {
  background: #111;
  color: #fff;
  border-color: #111;
}

.pagination button.disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.pagination .dots {
  padding: 0 6px;
  color: #888;
  font-size: 14px;
}

   </style>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3>User Details</h3>
      <div id="modalBody"></div>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <!-- JS -->
  <script type="module" src="./js/dashboard.js"></script>
  <!-- No Inspect -->

<script>
// Disable right-click context menu
document.addEventListener("contextmenu", function (event) {
  event.preventDefault();
});

// Disable common inspect shortcuts
document.addEventListener("keydown", function (event) {
  // F12
  if (event.key === "F12") {
    event.preventDefault();
  }
  // Ctrl+Shift+I or Ctrl+Shift+J or Ctrl+U or Ctrl+S
  if (
    (event.ctrlKey && event.shiftKey && (event.key === "I" || event.key === "J")) ||
    (event.ctrlKey && (event.key === "U" || event.key === "S"))
  ) {
    event.preventDefault();
  }
});
</script>

</body>
</html>
