<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="img/favicon.png">
<title>Ironnrootfitness | Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ================= THEME ================= */
:root {
  --bg: #f1f5f9;
  --panel: #ffffff;
  --panel-soft: #f8fafc;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --shadow: 0 12px 30px rgba(15,23,42,.08);
  --primary: #2563eb;
  --primary-dark: #1e40af;
  --primary-soft: rgba(37,99,235,.12);
  --radius: 14px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ================= LOADER ================= */
#accessloader {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.spinner {
  width: 38px;
  height: 38px;
  border: 3px solid var(--border);
  border-top: 3px solid var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ================= APP ================= */
#app {
  display: none;
  height: 100vh;
  display: grid;
  grid-template-rows: 64px 1fr;
}

/* ================= TOPBAR ================= */
.topbar {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 0 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ================= LAYOUT ================= */
.layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100%;
}

/* ================= SIDEBAR ================= */
.sidebar {
  background: linear-gradient(180deg, #ffffff, #f8fafc);
  border-right: 1px solid var(--border);
  padding: 24px;
  display: flex;
  flex-direction: column;
}

.brand {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 30px;
  color: var(--primary);
}

.nav-btn {
  width: 100%;
  background: none;
  border: none;
  padding: 14px 18px;
  margin-bottom: 10px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: all .25s ease;
}

.nav-btn:hover {
  background: var(--panel-soft);
  transform: translateX(3px);
}

.nav-btn.active {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 600;
  box-shadow: inset 3px 0 0 var(--primary);
}

.logout-btn {
  margin-top: auto;
  border: none;
  background: linear-gradient(135deg, #111827, #1f2937);
  color: white;
  padding: 14px;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
}

/* ================= CONTENT ================= */
.content {
  padding: 32px 36px;
  overflow-y: auto;
}

/* ================= KPI ================= */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 24px;
  margin-bottom: 32px;
}

.kpi {
  background: linear-gradient(180deg, #ffffff, #f8fafc);
  border-radius: var(--radius);
  padding: 26px;
  box-shadow: var(--shadow);
}

/* ================= SECTION ================= */
.section {
  background: var(--panel);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 26px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.section-head input {
  padding: 10px 22px;
  border-radius: 999px;
  border: 1px solid var(--border);
}

/* ================= TABLE (OVERFLOW FIX) ================= */
.table-wrapper {
  width: 100%;
  overflow-x: auto;
  border-radius: 12px;
}

/* Prevent table squeeze */
table {
  width: 100%;
  min-width: 1100px;
  border-collapse: collapse;
}

th {
  font-size: 12px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 16px;
  background: var(--panel-soft);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 2;
}

td {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

tbody tr:hover {
  background: #eef2ff;
}

/* Long text handling */
td.email,
td.payment {
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ================= MODAL ================= */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: #fff;
  width: 520px;
  max-height: 80vh;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
}

#modalBody {
  padding: 26px;
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  padding: 16px 26px;
  border-top: 1px solid var(--border);
  text-align: right;
}

/* ================= WORKOUT PLAN GRID ================= */
#modalBody .plan-wrapper {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

#modalBody .plan-item {
  background: var(--panel-soft);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
}

#modalBody .plan-item span {
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  display: block;
  margin-bottom: 4px;
}

#modalBody .plan-item.full {
  grid-column: span 2;
}

.close-btn {
  background: var(--primary);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="accessloader"><div class="spinner"></div></div>

<div id="app">

  <div class="topbar">
    <h1>Admin Dashboard</h1>
  </div>

  <div class="layout">

    <aside class="sidebar">
      <div class="brand">Ironnrootfitness</div>

      <button class="nav-btn active" data-col="personal_nutrition_plan" data-type="normal">Personal Nutrition Plan</button>
      <button class="nav-btn" data-col="personal_workout_plan" data-type="normal">Personal Workout Plan</button>
      <button class="nav-btn" data-col="ultimate_personal_coaching" data-type="normal">Ultimate Personal Coaching</button>
      <button class="nav-btn" data-col="users" data-type="visited">Visited Customer</button>
      <button class="nav-btn" data-col="scheduled_calls" data-type="scheduled">Scheduled Calls</button>
      <button class="nav-btn" data-col="permissions" data-type="permissions">Permissions</button>

      <button class="logout-btn" onclick="logout()">Logout</button>
    </aside>

    <main class="content">

      <div class="kpis">
        <div class="kpi"><p>Personal Nutrition Plan</p><h2 id="nutritionCount">0</h2></div>
        <div class="kpi"><p>Personal Workout Plan</p><h2 id="workoutCount">0</h2></div>
        <div class="kpi"><p>Ultimate Personal Coaching</p><h2 id="coachingCount">0</h2></div>
        <div class="kpi"><p>Scheduled Calls</p><h2 id="scheduledCount">0</h2></div>
      </div>

      <div class="section">
        <div class="section-head">
          <h3 id="collectionTitle">Personal Nutrition Plan</h3>
          <input id="searchInput" placeholder="Search..." />
        </div>

        <!-- ✅ TABLE WRAPPER -->
        <div class="table-wrapper">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="dataTable"></tbody>
          </table>
        </div>

        <div id="pagination" class="pagination"></div>
        <style>
          /* Pagination wrapper */
.pagination {
  display: flex;
  justify-content: flex-end; /* Right aligned */
  align-items: center;
  gap: 6px;
  margin-top: 20px;
  font-family: 'Inter', sans-serif;
}

/* Pagination buttons */
.pagination button {
  min-width: 36px;
  height: 36px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid #d0d7e2;
  background: #ffffff;
  color: #2b2f38;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}

/* Hover state */
.pagination button:hover {
  background: #f2f5ff;
  border-color: #4f6ef7;
  color: #4f6ef7;
}

/* Active page */
.pagination button.active {
  background: #4f6ef7;
  color: #ffffff;
  border-color: #4f6ef7;
  box-shadow: 0 4px 12px rgba(79, 110, 247, 0.25);
}

/* Disabled buttons */
.pagination button:disabled {
  background: #f5f7fb;
  color: #9aa3b2;
  border-color: #e2e6ef;
  cursor: not-allowed;
}

/* Optional: Previous / Next icons style */
.pagination .nav-btn {
  font-weight: 600;
}

        </style>
      </div>

    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div id="modalBody"></div>
      <div class="modal-footer">
        <button class="close-btn" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

</div>

<script type="module" src="./js/dashboard.js"></script>

   <!-- No Inspect -->

<script>
// Disable right-click context menu
document.addEventListener("contextmenu", function (event) {
  event.preventDefault();
});

// Disable common inspect shortcuts
document.addEventListener("keydown", function (event) {
  // F12
  if (event.key === "F12") {
    event.preventDefault();
  }
  // Ctrl+Shift+I or Ctrl+Shift+J or Ctrl+U or Ctrl+S
  if (
    (event.ctrlKey && event.shiftKey && (event.key === "I" || event.key === "J")) ||
    (event.ctrlKey && (event.key === "U" || event.key === "S"))
  ) {
    event.preventDefault();
  }
});
</script>
</body>
</html>
